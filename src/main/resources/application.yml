spring:
  application:
    name: hlh-ai-code-master
  profiles:
    active: local
  # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/hlh_ai_code_master
    username: root
    password: 123456
  # redis
  data:
    redis:
      host: localhost
      port: 6379
      password:
      ttl: 3600  # key过期时间，单位秒
      database: 0

server:
  port: 8234
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.hlh.hlhaicodemaster.controller
# knife4j http://localhost:8234/api/doc.html
knife4j:
  enable: true
  setting:
    language: zh_cn

# 日志级别配置，LangChain4j 的 LoggingHttpClient 需要 DEBUG 级别才能输出请求/响应日志
logging:
  level:
    dev.langchain4j: DEBUG