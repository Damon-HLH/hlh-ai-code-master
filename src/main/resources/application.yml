spring:
  application:
    name: hlh-ai-code-master
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/hlh_ai_code_master
    username: root
    password: 123456

server:
  port: 8234
  servlet:
    context-path: /api
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.hlh.hlhaicodemaster.controller
# knife4j http://localhost:8234/api/doc.html
knife4j:
  enable: true
  setting:
    language: zh_cn


